# C6 Energy Relay: starter ESPHome config
#
# BL0939 on UART (GPIO16 TX -> BL0939 RX, GPIO17 RX <- BL0939 TX, 4800 baud), two relays, status LED,
# BOOT button. Logs go to the native USB port (USB Serial/JTAG), which leaves UART0 to the BL0939.
#
# Calibrate once with a known load and a meter: set the *_cal substitutions to
# (meter reading / reported value). This board uses a 22 ohm ZMPT107 load (Seeed's meter: 24.9 ohm),
# so the voltage factor is about 24.9 / 22 = 1.13 before calibration. At 120 V line-neutral the signal
# is half the 240 V one; the same calibration covers both.
# If a channel reads negative power, turn the CT round (or swap its two wires).

substitutions:
  name: c6-energy-relay
  friendly_name: C6 Energy Relay
  uart_tx_pin: GPIO16
  uart_rx_pin: GPIO17
  relay1_pin: GPIO22
  relay2_pin: GPIO23
  led_pin: GPIO2
  boot_pin: GPIO9
  voltage_cal: "1.13"
  current1_cal: "1.0"
  current2_cal: "1.0"
  power1_cal: "1.13"
  power2_cal: "1.13"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

uart:
  id: bl_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 4800
  stop_bits: 1

sensor:
  - platform: bl0939
    uart_id: bl_uart
    update_interval: 10s
    voltage:
      name: Voltage
      filters:
        - multiply: ${voltage_cal}
    current_1:
      name: Current 1
      filters:
        - multiply: ${current1_cal}
    current_2:
      name: Current 2
      filters:
        - multiply: ${current2_cal}
    active_power_1:
      name: Power 1
      filters:
        - multiply: ${power1_cal}
    active_power_2:
      name: Power 2
      filters:
        - multiply: ${power2_cal}
    energy_1:
      name: Energy 1
    energy_2:
      name: Energy 2
    energy_total:
      name: Energy Total
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

switch:
  - platform: gpio
    id: relay1
    name: Relay 1
    pin: ${relay1_pin}
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: gpio
    id: relay2
    name: Relay 2
    pin: ${relay2_pin}
    restore_mode: RESTORE_DEFAULT_OFF

status_led:
  pin: ${led_pin}

binary_sensor:
  - platform: gpio
    name: Button
    pin:
      number: ${boot_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - switch.toggle: relay1
