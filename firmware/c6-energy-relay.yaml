# C6 Energy Relay: starter ESPHome config
#
# BL0939 on UART (GPIO16 TX -> BL0939 RX, GPIO17 RX <- BL0939 TX, 4800 baud), two relays, status LED,
# BOOT button. Logs go to the native USB port (USB Serial/JTAG), which leaves UART0 to the BL0939.
#
# Starting factors: ESPHome's bl0939 scales for a 1 mOhm shunt (1 mV/A) and a 0.51k / 1.95M divider.
# This board's CTs (100 A : 50 mA) work into 0.6 ohm, 0.3 mV/A, so current reads x 1/0.3 = 3.33; the
# ZMPT107 runs from 4 x 27k into 22 ohm, 0.204 mV/V against ESPHome's 0.2615, so voltage reads x 1.28;
# power and energy x 3.33 x 1.28 = 4.28. Then calibrate once with a known load and a meter: multiply
# each factor by (meter reading / reported value). The energy sensors use the power factors. At 120 V
# line-neutral the signal is half the 240 V one; the same calibration covers both.
# Relays always start off after a reboot or power cut (ALWAYS_OFF): a load never comes back on its own.
# If a channel reads negative power, turn the CT round (or swap its two wires).

substitutions:
  name: c6-energy-relay
  friendly_name: C6 Energy Relay
  uart_tx_pin: GPIO16
  uart_rx_pin: GPIO17
  relay1_pin: GPIO22
  relay2_pin: GPIO23
  led_pin: GPIO2
  boot_pin: GPIO9
  voltage_cal: "1.28"
  current1_cal: "3.33"
  current2_cal: "3.33"
  power1_cal: "4.28"
  power2_cal: "4.28"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c6
  board: esp32-c6-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

uart:
  id: bl_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 4800
  stop_bits: 1

sensor:
  - platform: bl0939
    uart_id: bl_uart
    update_interval: 10s
    voltage:
      name: Voltage
      filters:
        - multiply: ${voltage_cal}
    current_1:
      name: Current 1
      filters:
        - multiply: ${current1_cal}
    current_2:
      name: Current 2
      filters:
        - multiply: ${current2_cal}
    active_power_1:
      name: Power 1
      filters:
        - multiply: ${power1_cal}
    active_power_2:
      name: Power 2
      filters:
        - multiply: ${power2_cal}
    energy_1:
      name: Energy 1
      filters:
        - multiply: ${power1_cal}
    energy_2:
      name: Energy 2
      filters:
        - multiply: ${power2_cal}
    energy_total:
      name: Energy Total
      filters:
        - multiply: ${power1_cal}   # one factor for the sum: calibrate both channels alike
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

switch:
  - platform: gpio
    id: relay1
    name: Relay 1
    pin: ${relay1_pin}
    restore_mode: ALWAYS_OFF
  - platform: gpio
    id: relay2
    name: Relay 2
    pin: ${relay2_pin}
    restore_mode: ALWAYS_OFF

status_led:
  pin: ${led_pin}

binary_sensor:
  - platform: gpio
    name: Button
    pin:
      number: ${boot_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - switch.toggle: relay1
