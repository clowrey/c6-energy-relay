# C6 Energy Relay: starter ESPHome config
#
# ESP32-C5 module (DOIT ESPC5-32-H4: 2.4 + 5 GHz Wi-Fi 6). BL0939 on a UART (GPIO1 TX -> BL0939 RX, GPIO0 RX <-
# BL0939 TX, 4800 baud), two relays, status LED, BOOT button (GPIO28), Qwiic I2C. Logs go to the native USB port
# (USB Serial/JTAG).
#
# Starting factors: ESPHome's bl0939 scales for a 1 mOhm shunt (1 mV/A) and a 0.51k / 1.95M divider.
# This board's CTs (100 A : 50 mA) work into 0.6 ohm, 0.3 mV/A, so current reads x 1/0.3 = 3.33; the
# ZMPT107 runs from 4 x 100k into 51 ohm, 0.1275 mV/V against ESPHome's 0.2615, so voltage reads x 2.05;
# power and energy x 3.33 x 2.05 = 6.84. Then calibrate once with a known load and a meter: multiply
# each factor by (meter reading / reported value). The energy sensors use the power factors. At 120 V
# line-neutral the signal is half the 240 V one; the same calibration covers both.
# Relays always start off after a reboot or power cut (ALWAYS_OFF): a load never comes back on its own.
# Each coil gets full voltage for coil_pull_in, then PWM at coil_hold (the relay's datasheet allows a hold at
# 50 % of rated voltage). At 60 % a held coil makes about a third of the heat. coil_hold "100%" turns this off.
# If a channel reads negative power, turn the CT round (or swap its two wires).

substitutions:
  name: c6-energy-relay
  friendly_name: C6 Energy Relay
  uart_tx_pin: GPIO1
  uart_rx_pin: GPIO0
  relay1_pin: GPIO6
  relay2_pin: GPIO12
  led_pin: GPIO5
  boot_pin: GPIO28
  i2c_sda_pin: GPIO2
  i2c_scl_pin: GPIO3
  coil_hold: "60%"
  coil_pull_in: 300ms
  voltage_cal: "2.05"
  current1_cal: "3.33"
  current2_cal: "3.33"
  power1_cal: "6.84"
  power2_cal: "6.84"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}

esp32:
  variant: esp32c5
  board: esp32-c5-devkitc-1
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

api:
  encryption:
    key: !secret api_key

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password

captive_portal:

uart:
  id: bl_uart
  tx_pin: ${uart_tx_pin}
  rx_pin: ${uart_rx_pin}
  baud_rate: 4800
  stop_bits: 2        # the BL0939 uses 1.5; ESPHome's BL0939 page asks for 2

i2c:
  id: qwiic_i2c
  sda: ${i2c_sda_pin}
  scl: ${i2c_scl_pin}
  scan: true

sensor:
  - platform: bl0939
    uart_id: bl_uart
    update_interval: 10s
    voltage:
      name: Voltage
      filters:
        - multiply: ${voltage_cal}
    current_1:
      name: Current 1
      filters:
        - multiply: ${current1_cal}
    current_2:
      name: Current 2
      filters:
        - multiply: ${current2_cal}
    active_power_1:
      name: Power 1
      filters:
        - multiply: ${power1_cal}
    active_power_2:
      name: Power 2
      filters:
        - multiply: ${power2_cal}
    energy_1:
      id: energy_1
      name: Energy 1
      filters:
        - multiply: ${power1_cal}
    energy_2:
      id: energy_2
      name: Energy 2
      filters:
        - multiply: ${power2_cal}
  # the sum of both calibrated energies (the chip's own total can't use both channels' factors)
  - platform: template
    name: Energy Total
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    update_interval: 10s
    lambda: |-
      if (!id(energy_1).has_state() || !id(energy_2).has_state()) return {};
      return id(energy_1).state + id(energy_2).state;
  - platform: wifi_signal
    name: WiFi Signal
    update_interval: 60s

output:
  - platform: ledc
    id: relay1_coil
    pin: ${relay1_pin}
    frequency: 20000Hz      # above hearing; the coil and its flyback diode smooth the current
  - platform: ledc
    id: relay2_coil
    pin: ${relay2_pin}
    frequency: 20000Hz

script:
  - id: relay1_pull_in
    mode: restart
    then:
      - output.turn_on: relay1_coil
      - delay: ${coil_pull_in}
      - if:
          condition:
            switch.is_on: relay1
          then:
            - output.set_level:
                id: relay1_coil
                level: ${coil_hold}
  - id: relay2_pull_in
    mode: restart
    then:
      - output.turn_on: relay2_coil
      - delay: ${coil_pull_in}
      - if:
          condition:
            switch.is_on: relay2
          then:
            - output.set_level:
                id: relay2_coil
                level: ${coil_hold}

switch:
  - platform: template
    id: relay1
    name: Relay 1
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: relay1_pull_in
    turn_off_action:
      - script.stop: relay1_pull_in
      - output.turn_off: relay1_coil
  - platform: template
    id: relay2
    name: Relay 2
    optimistic: true
    restore_mode: ALWAYS_OFF
    turn_on_action:
      - script.execute: relay2_pull_in
    turn_off_action:
      - script.stop: relay2_pull_in
      - output.turn_off: relay2_coil

status_led:
  pin: ${led_pin}

binary_sensor:
  - platform: gpio
    name: Button
    pin:
      number: ${boot_pin}
      inverted: true
      mode:
        input: true
        pullup: true
    on_click:
      - switch.toggle: relay1
